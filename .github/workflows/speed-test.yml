name: TVProxy CI

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        type: choice
        options:
          - update
          - tlive
          - both
        default: both

jobs:
  update:
    if: github.event.inputs.action == 'update' || github.event.inputs.action == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Install yq
        run: pip install yq

      - name: Setup sing-box
        run: chmod +x t-box/sing-box

      - name: Run update
        run: |
          cd t-box
          chmod +x update.sh
          bash update.sh

      - name: Commit
        env:
          GIT_NAME: github-actions[bot]
          GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config --local user.name "$GIT_NAME"
          git config --local user.email "$GIT_EMAIL"
          git add t-box/config.json t-box/raw/
          if ! git diff --staged --quiet; then
            git commit -m "auto: subscription update $(date '+%Y-%m-%d %H:%M:%S')"
          else
            echo "no changes"
          fi

      - name: Push
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PUSH_TOKEN }}
          branch: main
          force: false

  tlive:
    needs: update
    if: always() && (github.event.inputs.action == 'tlive' || github.event.inputs.action == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Setup sing-box
        run: chmod +x t-box/sing-box

      - name: Run tlive
        run: |
          cd t-box
          chmod +x tlive.sh
          bash tlive.sh

      - name: Commit alive nodes
        if: success()
        env:
          GIT_NAME: github-actions[bot]
          GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config --local user.name "$GIT_NAME"
          git config --local user.email "$GIT_EMAIL"
          git add t-box/alive_nodes.txt
          if ! git diff --staged --quiet; then
            git commit -m "auto: tlive alive nodes $(date '+%Y-%m-%d %H:%M:%S')"
          fi

      - name: Push
        if: success()
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PUSH_TOKEN }}
          branch: main
          force: false

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlive-output
          path: |
            t-box/alive_nodes.txt
            t-box/sing-box.log
          retention-days: 7