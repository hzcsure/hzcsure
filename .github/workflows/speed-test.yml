name: Speed Test

on:
  push:
    paths:
      - 't-box/config.json'
      - '.github/workflows/speed-test.yml'
      - 't-box/speed-test.sh'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup sing-box
        run: |
          chmod +x t-box/sing-box
          t-box/sing-box version

      - name: Run speed test
        id: test
        run: |
          cd t-box
          chmod +x speed-test.sh
          bash speed-test.sh config.json 2>&1 | tee speed-test.log
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Speed Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f t-box/speed-test.log ]; then
            tail -20 t-box/speed-test.log >> $GITHUB_STEP_SUMMARY
          else
            echo "(no log - sing-box may have failed to start)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-test-log
          path: t-box/speed-test.log
          retention-days: 7