name: TVProxy CI

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        type: choice
        options:
          - update
          - tlive
          - both
        default: both

jobs:
  update:
    if: github.event.inputs.action == 'update' || github.event.inputs.action == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: pip install yq

      - name: Setup sing-box
        run: chmod +x t-box/sing-box

      - name: Run update
        run: |
          cd t-box
          chmod +x update.sh
          bash update.sh

      - name: Commit config
        run: |
          git config user.name "tvproxy-bot"
          git config user.email "bot@tvproxy"
          git add t-box/config.json t-box/cache/ t-box/raw/
          if ! git diff --staged --quiet; then
            git commit -m "auto: subscription update"
            git push
          else
            echo "no changes"
          fi

  tlive:
    needs: update
    if: always() && (github.event.inputs.action == 'tlive' || github.event.inputs.action == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup sing-box
        run: chmod +x t-box/sing-box

      - name: Run tlive
        run: |
          cd t-box
          chmod +x tlive.sh
          bash tlive.sh

      - name: Commit alive nodes
        if: success()
        run: |
          git config user.name "tvproxy-bot"
          git config user.email "bot@tvproxy"
          git add t-box/alive_nodes.txt
          if ! git diff --staged --quiet; then
            git commit -m "auto: tlive alive nodes update"
            git push
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlive-output
          path: |
            t-box/alive_nodes.txt
            t-box/sing-box.log
          retention-days: 7
