name: get_sub

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: sub
        run: |
          npm install
          # 安装 puppeteer 浏览器
          npx puppeteer browsers install chrome

      - name: 运行抓取脚本
        working-directory: sub
        run: node crawl.js
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: 上传结果文件
        uses: actions/upload-artifact@v4
        with:
          name: subscription-result
          path: |
            sub/result.json
            sub/README-result.md

      - name: 提交结果到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sub/result.json sub/README-result.md
          git commit -m "更新订阅链接 $(date +'%Y-%m-%d %H:%M')" || echo "无变化，不提交"
          git push
