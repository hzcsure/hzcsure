name: 抓取订阅链接

on:
  # 手动触发
  workflow_dispatch:
  
  # 定时触发（每天早上8点）
  schedule:
    - cron: '0 0 * * *'  # UTC 0点 = 北京时间 8点

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Puppeteer 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgcc1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            lsb-release \
            wget \
            xdg-utils

      - name: 安装 npm 依赖
        run: npm install
        env:
          PUPPETEER_DOWNLOAD_HOST: https://npmmirror.com/mirrors  # 国内镜像加速（可选）

      - name: 运行抓取脚本
        run: node crawl.js

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: subscription-result
          path: result.json

      - name: 提交结果到仓库（可选）
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add result.json
          git commit -m "更新订阅链接 $(date +'%Y-%m-%d %H:%M')" || echo "无变化"
          git push
