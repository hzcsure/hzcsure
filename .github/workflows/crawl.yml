name: get_sub

on:
  workflow_dispatch:
  schedule:
    - cron: '50 19 * * *'
env:
  XOR_KEY: ${{ secrets.XOR_KEY }}
  
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: sub
        run: |
          npm install
          # 安装 puppeteer 浏览器
          npx puppeteer browsers install chrome

      - name: 运行抓取脚本
        working-directory: sub
        run: node crawl.js
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: 加密订阅链接
        run: |
          chmod +x xor-enc
          [ -f sub/result.json ] || { echo "result.json not found"; exit 1; }
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            ./xor-enc "$url v2rayNG/1.8.0"
          done < sub/result.json > sub/result_enc.json
          mv sub/result_enc.json sub/result.json

      - name: 上传结果文件
        uses: actions/upload-artifact@v4
        with:
          name: subscription-result
          path: sub/result.json

      - name: 提交结果到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          cat sub/result.json >> oo
          sort -u oo -o oo
          git add oo
          git commit -m "更新加密订阅链接 $(date +'%Y-%m-%d %H:%M')" || echo "无变化，不提交"
          git push
